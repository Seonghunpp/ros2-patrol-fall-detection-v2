<style>html,body{margin:0;padding:0}iframe{border:0;display:block;width:100vw;height:100vh}</style>
<iframe id="f" src="index.html"></iframe>
<script>
  const what = location.hash.slice(1) || 'patients';
  document.getElementById('f').onload = function () {
    const w = this.contentWindow;
    if (what === 'patients') {
      w.sessionStorage.setItem('dabom-role', 'admin');
      w.sessionStorage.setItem('dabom-name', '김간호 · 관리자');
      w.renderNav(); w.showTab('patients');
    }
    if (what === 'apply') {
      w.sessionStorage.clear(); w.renderNav();
      w.eval(`openApply();
        document.getElementById('apply-name').value='정보호';
        const p=document.getElementById('apply-phone'); p.value='01011112222'; formatPhone(p);
        document.getElementById('apply-patient').value='최판서';
        document.getElementById('apply-room').value='104';`);
    }
  };
</script>
